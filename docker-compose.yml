services:
  db:
    image: postgis/postgis:16-3.4
    container_name: politent-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POLITENT_DB_NAME:-politent}
      POSTGRES_USER: ${POLITENT_DB_USER:-politent}
      POSTGRES_PASSWORD: ${POLITENT_DB_PASSWORD:-politent_local}
    ports:
      - "${POLITENT_DB_PORT:-55432}:5432"
    volumes:
      - politent_pgdata:/var/lib/postgresql/data
      - ./schemas/politent_core_schema.sql:/docker-entrypoint-initdb.d/010_politent_core_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POLITENT_DB_USER:-politent} -d ${POLITENT_DB_NAME:-politent}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  politent_pgdata:
