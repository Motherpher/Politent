name: WP1.2 Geography Registry Validation

on:
  push:
    branches: [main]
    paths:
      - "schemas/politent_core_schema.sql"
      - "schemas/politent_geography_schema.sql"
      - "schemas/seed_geography_registry.sql"
      - "sources/geography_sources.json"
      - ".github/workflows/wp1_2_registry.yml"
  workflow_dispatch:

jobs:
  registry:
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: politent
          POSTGRES_USER: politent
          POSTGRES_PASSWORD: politent_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U politent -d politent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      PGPASSWORD: politent_ci

    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Apply schemas and seed registry
        run: |
          psql -h localhost -U politent -d politent -v ON_ERROR_STOP=1 -f schemas/politent_core_schema.sql
          psql -h localhost -U politent -d politent -v ON_ERROR_STOP=1 -f schemas/politent_geography_schema.sql
          psql -h localhost -U politent -d politent -v ON_ERROR_STOP=1 -f schemas/seed_geography_registry.sql

      - name: Validate canonical geography releases
        run: |
          test "$(psql -h localhost -U politent -d politent -Atc "SELECT count(*) FROM geography_release;")" = "3"
          test "$(psql -h localhost -U politent -d politent -Atc "SELECT expected_feature_count FROM geography_release WHERE release_id='DESO_2018';")" = "5984"
          test "$(psql -h localhost -U politent -d politent -Atc "SELECT expected_feature_count FROM geography_release WHERE release_id='DESO_2025';")" = "6160"
          test "$(psql -h localhost -U politent -d politent -Atc "SELECT expected_feature_count FROM geography_release WHERE release_id='POLLING_DISTRICT_2026';")" = "6312"
          test "$(psql -h localhost -U politent -d politent -Atc "SELECT count(*) FROM source_registry WHERE source_id IN ('SCB_DESO_2018','SCB_DESO_2025','VAL_POLLING_DISTRICTS_2026','VAL_POLLING_DISTRICT_COMPARE_2022_2026');")" = "4"
