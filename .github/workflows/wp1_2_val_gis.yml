name: WP1.2 Election Authority GIS Format Validation

on:
  push:
    branches: [main]
    paths:
      - "scripts/count_valdistrict_json.py"
      - "scripts/parse_valdistrict_crosswalk.py"
      - ".github/workflows/wp1_2_val_gis.yml"
  workflow_dispatch:

jobs:
  val-gis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XLSX tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip python3-openpyxl

      - name: Download official 2026 district GIS and comparison workbook
        run: |
          curl -L --fail --retry 3 'https://www.val.se/download/18.332cf48819bd61ac1513889/1785491689960/valdistrikt-riket-2026.zip' -o /tmp/valdistrikt.zip
          curl -L --fail --retry 3 'https://www.val.se/download/18.1a2972da19f159e73fd3a47/1787064655347/valdistrikt-jamforelser-mellan-2022-och-2026.xlsx' -o /tmp/compare.xlsx

      - name: Inspect archive
        run: |
          unzip -l /tmp/valdistrikt.zip | head -80
          rm -rf /tmp/valdistrikt && mkdir /tmp/valdistrikt
          unzip -q /tmp/valdistrikt.zip -d /tmp/valdistrikt
          find /tmp/valdistrikt -maxdepth 4 -type f -printf '%P\n' | head -80

      - name: Count district JSON records
        run: |
          mapfile -t FILES < <(find /tmp/valdistrikt -type f \( -iname '*.json' -o -iname '*.geojson' \))
          echo "Candidate GIS JSON files: ${#FILES[@]}"
          test "${#FILES[@]}" -gt 0
          python3 scripts/count_valdistrict_json.py "${FILES[@]}"

      - name: Parse official 2022-2026 comparison workbook
        run: |
          python3 scripts/parse_valdistrict_crosswalk.py /tmp/compare.xlsx /tmp/compare.csv
          head -5 /tmp/compare.csv
          test "$(wc -l < /tmp/compare.csv)" -gt 1000
